# bSDD Toolkit (web app)
#
#   curl -O https://raw.githubusercontent.com/c-mellueh/bSDD-Toolkit/main/compose.yaml
#   curl -o .env https://raw.githubusercontent.com/c-mellueh/bSDD-Toolkit/main/.env.example
#   # edit .env, then:
#   docker compose up -d        ->  http://localhost:8000
#
# All settings live in .env (see .env.example). Without a .env file the defaults are used.
services:
  bsdd-toolkit:
    image: krapottke/bsdd-toolkit:${BSDD_TOOLKIT_TAG:-latest}
    # build: .            # alternatively build the image locally from a checkout of the repository
    container_name: bsdd-toolkit
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - bsdd-data:/data
    env_file:
      - path: .env
        required: false
    # If you put a reverse proxy (Traefik, nginx, Caddy, Cloudflare Tunnel) in front, make sure it
    # forwards WebSocket upgrades for /api/projects/<id>/ws.

volumes:
  bsdd-data:
